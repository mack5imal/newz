# Sends the libraries that ship in the Newz APK to GitHub's dependency graph, so Dependabot
# alerts cover them (GitHub cannot read Gradle version catalogs on its own). Only the release
# runtime classpath is reported: build and test tools (lint, ktlint, the emulator test runner)
# never reach a phone. Resolves dependencies only; nothing is built, tested or published.
name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required to submit to the dependency graph

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@v6
        with:
          dependency-graph-include-configurations: releaseRuntimeClasspath
