# Sends Newz's resolved Gradle dependencies to GitHub's dependency graph, so Dependabot alerts
# cover every library (GitHub cannot read Gradle version catalogs on its own). Resolves
# dependencies only; nothing is built, tested or published.
name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # required to submit to the dependency graph

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/dependency-submission@v6
