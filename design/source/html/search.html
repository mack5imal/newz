<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newz — find sources and topics</title>

<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="newz.css">
<style>
body{margin:0}
a{color:#1D3A5F}a:hover{color:#33557F}
</style>
</head>
<body>
<div class="nz">
<header class="ab"><div class="abr sub" style="gap: 4px"><button class="ib" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg></button><div class="tf"><input type="search" aria-label="Search outlets, topics or a web address" placeholder="Outlets, topics or a web address"></div></div></header>
<div class="split" aria-hidden="true"></div>
<main style="padding-top: 14px">
<section class="panel">
<div class="note"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg><span>Find an outlet or topic by name, or paste any site’s address — Newz looks for its RSS or Atom feed.</span></div>
<div class="note" style="border-top: 1px solid var(--line2)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M5 4.5a14.5 14.5 0 0 1 14.5 14.5M5 10.5a8.5 8.5 0 0 1 8.5 8.5"></path><circle cx="6" cy="18" r="1.5"></circle></svg><span>Already have a feed address? Paste it here and add it directly.</span></div>
<div class="note" style="border-top: 1px solid var(--line2)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"></path></svg><span class="rs" style="font-size: 15px; line-height: 22px">Searching the built-in list happens on this phone. Checking an address only contacts that site.</span></div>
</section>
</main>
</div>
</body>
</html>
