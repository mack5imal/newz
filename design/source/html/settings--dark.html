<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newz — settings, dark</title>

<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="newz.css">
<style>
body{margin:0}
a{color:#DCE5F2}a:hover{color:#FFFFFF}
</style>
</head>
<body>
<div class="nz dk" style="height: 1120px">
<header class="ab"><div class="abr sub"><button class="ib" aria-label="Back"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg></button><h1 class="st">Settings</h1></div></header>
<div class="split" aria-hidden="true"></div>
<main style="padding-top: 14px">
<section class="panel" aria-labelledby="sp1">
<h2 class="ph" id="sp1">Your feed</h2>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5a14.5 14.5 0 0 1 14.5 14.5M5 10.5a8.5 8.5 0 0 1 8.5 8.5"></path><circle cx="6" cy="18" r="1.5"></circle></svg><span class="grow"><span class="rt" style="display: block">Sources</span><span class="rs" style="display: block">24 followed · 1 not loading</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5V4h8.5l8.5 8.5-8.5 8.5z"></path><circle cx="8" cy="8.5" r="1.5"></circle></svg><span class="grow"><span class="rt" style="display: block">Topics &amp; keywords</span><span class="rs" style="display: block">8 topics · 3 muted keywords</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9 9 0 0 1 12 6c5 0 9 6 9 6a15.5 15.5 0 0 1-2.6 3.3M6.3 7.6C4.2 9.2 3 12 3 12s4 6 9 6c1.5 0 2.9-.4 4.1-1.1M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg><span class="grow"><span class="rt" style="display: block">Hidden articles</span><span class="rs" style="display: block">6 hidden</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"></path></svg><span class="grow"><span class="rt" style="display: block">Saved</span><span class="rs" style="display: block">4 saved for later</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5L21 21"></path></svg><span class="grow"><span class="rt" style="display: block">Find sources</span><span class="rs" style="display: block">Search outlets and topics, or add any site</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg><span class="grow"><span class="rt" style="display: block">Suggestions</span><span class="rs" style="display: block">Worked out on this phone from what you follow</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
</section>
<section class="panel" aria-labelledby="sp2">
<h2 class="ph" id="sp2">Reading</h2>
<div class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="1"></rect><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"></path></svg><span class="grow"><span class="rt" style="display: block">Paywall filter</span><span class="rs" style="display: block">Hide outlets that need a subscription</span></span><button class="sw on" role="switch" aria-checked="true" aria-label="Paywall filter" style="margin-right: 8px"></button></div>
<div class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span class="grow"><span class="rt" style="display: block">Reading history</span><span class="rs" style="display: block">Kept only on this phone, to tune your feed and suggestions</span></span><button class="sw on" role="switch" aria-checked="true" aria-label="Reading history" style="margin-right: 8px"></button></div>
<div class="row" style="padding-left: 52px"><button class="btn ol">Clear reading history</button></div>
<div class="row" style="flex-direction: column; align-items: stretch; gap: 12px; padding: 14px 16px 16px">
<div style="display: flex; align-items: center; gap: 14px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M4 18L9 6l5 12M5.8 14h6.4M15 18l3-7 3 7M15.9 16h4.2"></path></svg><span class="rt" id="ts-label">Text size</span></div>
<div class="seg" role="group" aria-labelledby="ts-label"><button aria-pressed="false">Small</button><button class="on" aria-pressed="true">Default</button><button aria-pressed="false">Large</button><button aria-pressed="false">Extra large</button></div>
</div>
</section>
<section class="panel" aria-labelledby="sp3">
<h2 class="ph" id="sp3">Your data</h2>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg><span class="grow"><span class="rt" style="display: block">Backup &amp; restore</span><span class="rs" style="display: block">Export or import your choices as a file</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
<button class="row"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"></path></svg><span class="grow"><span class="rt" style="display: block">About</span><span class="rs" style="display: block">Privacy statement and credits</span></span><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--ic)"><path d="M9 6l6 6-6 6"></path></svg></button>
</section>
</main>
</div>
</body>
</html>
